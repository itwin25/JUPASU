[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.49.2",
    "einops>=0.8.2",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "jiwer>=4.0.0",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.10",
    "onnx>=1.20.1",
    "onnxruntime>=1.24.3",
    "onnxscript>=0.6.2",
    "optimum[onnxruntime]>=1.17.1",
    "pillow>=12.1.1",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "timm>=1.0.25",
    "torch>=2.10.0",
    "transformers<5.0.0",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
