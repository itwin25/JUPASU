[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=0.26.0",
    "bitsandbytes>=0.49.2",
    "einops>=0.8.2",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.17",
    "langchain-google-genai>=4.2.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.10",
    "onnx>=1.20.1",
    "onnxruntime>=1.24.3; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.24.3; sys_platform != 'darwin'",
    "onnxscript>=0.6.2",
    "onnxslim>=0.1.87",
    "numpy>=1.26.0",
    "pillow>=12.1.1",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
