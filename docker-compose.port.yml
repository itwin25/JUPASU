services:
  # Database: PostgreSQL 18 with pgvector extension
  db:
    image: pgvector/pgvector:pg18
    container_name: db-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jupasu}
      POSTGRES_USER: ${POSTGRES_USER:-jupasu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jupasu_pass}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jupasu_user} -d ${POSTGRES_DB:-jupasu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # Cache & Session: Redis
  redis:
    image: redis:7.4-alpine
    container_name: cache-redis
    restart: always
    expose:
      - "6379"
    networks:
      - backend-network

  # AI Service: Python 3.12 (Local Build)
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai-fastapi
    restart: always
    expose:
      - "8000"
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy

  # Backend: Spring Boot 4.0 (Local Build)
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: backend-spring
    restart: always
    environment:
      Spring_Profiles_Active: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-jupasu}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jupasu_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jupasu_pass}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-"http://localhost,https://j14a505.p.ssafy.io"}
      TARGET_IMAGE_DIR: /app/uploads/images/wines
      DATA_FILE_PATH: /app/data/vivino_ultra_results_kr_food.json
    expose:
      - "8080"
    volumes:
      - ./back/uploads:/app/uploads
      - /home/ubuntu/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ai:
        condition: service_started
    networks:
      - backend-network
      - frontend-network

  # Frontend: Next.js (Local Build)
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_URL}
    container_name: front-nextjs
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - frontend-network

  # Reverse Proxy: Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-network
      - backend-network

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  postgres_data:
