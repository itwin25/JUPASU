events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M; # 파일 업로드 용량 제한 증가

    # Spring Boot backend
    upstream backend {
        server backend:8080;
    }

    # Next.js frontend
    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name j14a505.p.ssafy.io;
        
        # HTTP 요청을 HTTPS로 리다이렉트 (포트 유지)
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name j14a505.p.ssafy.io;

        # 인증서 경로
        ssl_certificate /etc/letsencrypt/live/j14a505.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/j14a505.p.ssafy.io/privkey.pem;

        # Nginx Exporter가 접근할 전용 엔드포인트
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }

        # Swagger UI → Spring Boot
        location ^~ /swagger-ui {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # OpenAPI JSON/YAML → Spring Boot
        location ^~ /v3/api-docs {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # API 요청 → Spring Boot
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # AI 스트리밍을 위한 설정
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;

            # AI 분석 시간을 고려한 타임아웃 연장
            proxy_connect_timeout 300s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        # 와인 이미지 등 정적 파일 → Spring Boot
        location /images/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js 정적 자원 (캐싱)
        location /_next/static/ {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 프론트엔드 (Next.js) — HMR WebSocket 포함
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $http_host; 
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host; 
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 300s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }
    }
}
