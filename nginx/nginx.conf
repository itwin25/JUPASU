events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Spring Boot backend
    upstream backend {
        server backend:8080;
    }

    # Next.js frontend
    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name j14a505.p.ssafy.io;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name j14a505.p.ssafy.io;

        # 인증서 경로
        ssl_certificate /etc/letsencrypt/live/j14a505.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/j14a505.p.ssafy.io/privkey.pem;

        # API 요청 → Spring Boot
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # Next.js 정적 자원 (캐싱)
        location /_next/static/ {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 프론트엔드 (Next.js) — HMR WebSocket 포함
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
