services:
  # Database: PostgreSQL 18 with pgvector extension
  db:
    image: pgvector/pgvector:pg18
    container_name: db-postgres-dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8282:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network-dev
      - monitoring

  # Cache & Session: Redis
  redis:
    image: redis:7.4-alpine
    container_name: cache-redis-dev
    restart: always
    ports:
      - "6380:6379"
    networks:
      - backend-network-dev
      - monitoring

  # AI Service: Python 3.12 (KoNLPy, Scikit-learn)
  ai:
    image: ${DOCKER_USER}/jupasu:ai-dev
    container_name: ai-fastapi-dev
    restart: always
    networks:
      - backend-network-dev
      - monitoring
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8001:8000

  # Backend: Spring Boot 4.0 (Java 21)
  backend:
    image: ${DOCKER_USER}/jupasu:back-dev
    container_name: backend-spring-dev
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ai:
        condition: service_started
    networks:
      - backend-network-dev
      - frontend-network-dev
      - monitoring

  # Frontend: Next.js (React 19)
  frontend:
    image: ${DOCKER_USER}/jupasu:front-dev
    container_name: front-nextjs-dev
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - frontend-network-dev

  # Reverse Proxy: Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    restart: always
    ports:
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-network-dev
      - backend-network-dev
      - monitoring

networks:
  frontend-network-dev:
    driver: bridge
  backend-network-dev:
    driver: bridge
  monitoring:
    external: true

volumes:
  postgres_data:
