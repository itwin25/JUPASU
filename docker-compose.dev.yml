services:
  # Database: PostgreSQL 18 with pgvector extension
  db:
    image: pgvector/pgvector:pg18
    container_name: db-postgres-dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8282:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network-dev
      - monitoring

  # Cache & Session: Redis
  redis:
    image: redis:7.4-alpine
    container_name: cache-redis-dev
    restart: always
    ports:
      - "6380:6379"
    networks:
      - backend-network-dev
      - monitoring

  # Backend: Spring Boot 4.0 (Java 21)
  backend:
    image: ${DOCKER_USER}/jupasu:back-dev
    container_name: backend-spring-dev
    restart: always
    environment:
      Spring_Profiles_Active: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 개발 서버에서도 외부 AI 서버(터널 등)를 바라보도록 설정
      AI_SERVICE_URL: ${AI_SERVER_URL:-http://host.docker.internal:18000}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ALLOWED_ORIGINS: "http://localhost,https://j14a505.p.ssafy.io:8443"
      TARGET_IMAGE_DIR: /app/uploads/images/wines
      DATA_FILE_PATH: /app/data/vivino_ultra_results_kr_food.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    volumes:
      - ./back/uploads:/app/uploads
      - ../data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend-network-dev
      - frontend-network-dev
      - monitoring

  # Frontend: Next.js (React 19)
  frontend:
    image: ${DOCKER_USER}/jupasu:front-dev
    container_name: front-nextjs-dev
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - frontend-network-dev

  # Reverse Proxy: Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    restart: always
    ports:
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-network-dev
      - backend-network-dev
      - monitoring

networks:
  frontend-network-dev:
    driver: bridge
  backend-network-dev:
    driver: bridge
  monitoring:
    external: true

volumes:
  postgres_data:
