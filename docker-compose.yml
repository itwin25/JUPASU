services:
  # Database: PostgreSQL 18 with pgvector extension
  db:
    image: pgvector/pgvector:pg18
    container_name: db-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache & Session: Redis
  redis:
    image: redis:7.4-alpine
    container_name: cache-redis
    restart: always
    ports:
      - "6379:6379"

  # Backend: Spring Boot 4.0 (Java 21)
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: backend-spring
    restart: always
    environment:
      # Spring Boot 표준 환경 변수명 사용
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-jupasu}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jupasu_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jupasu_pass}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      
      # AI 및 기타 설정
      AI_SERVICE_URL: ${AI_SERVER_URL:-http://host.docker.internal:18000}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SOURCE_IMAGE_DIR: /app/source_images
      TARGET_IMAGE_DIR: /app/uploads/images/wines
      DATA_FILE_PATH: /app/data/vivino_ultra_results_kr_food.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/ubuntu/data/image:/app/source_images:ro
      - /home/ubuntu/data:/app/data:ro
      - ./uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Frontend: Next.js (React 19)
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: front-nextjs
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    expose:
      - "80"
    depends_on:
      - backend

  # Reverse Proxy: Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: